events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    # Detailed logging format for API proxy debugging
    log_format api_proxy '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent '
                         'upstream: "$upstream_addr" '
                         'upstream_status: "$upstream_status" '
                         'upstream_response_time: "$upstream_response_time" '
                         'request_time: "$request_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    server {
        listen 3000;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Root directory
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Proxy API requests to private API Gateway
        location /api/ {
            # Use detailed logging for API proxy
            access_log /var/log/nginx/access.log api_proxy;
            
            # Remove /api prefix and forward to API Gateway
            rewrite ^/api/(.*) /prod/$1 break;
            
            # Proxy to private API Gateway via VPC endpoint
            # Using VPC endpoint format: {api-id}-{vpce-id}.execute-api.{region}.amazonaws.com
            proxy_pass ${API_ENDPOINT};
            
            # CRITICAL: Set Host header to the VPC endpoint hostname for private API Gateway
            # This is dynamically set from the API_HOST environment variable
            proxy_set_header Host ${API_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Pass Authorization header from client
            proxy_pass_request_headers on;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Log the actual upstream being used
            add_header X-Debug-Upstream ${API_ENDPOINT} always;
            add_header X-Debug-Host ${API_HOST} always;
        }

        # Handle React Router
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets (except JS/CSS which change frequently)
        location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # No caching for JS and CSS to ensure updates are loaded immediately
        location ~* \.(js|css)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
        }

        # Security: deny access to hidden files
        location ~ /\. {
            deny all;
        }
    }
}
